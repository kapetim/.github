name: "Epic"
description: "Level 1 — a folder/domain parent that consolidates all similar issues."
title: "📁 "
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: |
        ## Epic (level 1)
        One epic per folder/domain. It consolidates every related issue and is **never closed**.

        **Hierarchy:** `epic → feature → task`
        - every **Feature** is a sub-issue of an epic (use the Feature template);
        - every **Task** is a sub-issue of a feature (use the Task template).

        Example: `🎨 UI` (epic) → `login page` (feature) → `build form` (task).
  - type: input
    id: folder
    attributes:
      label: Folder / domain
      description: The repo path or area this epic owns.
      placeholder: src/ui/  ·  .github/  ·  docs/
    validations:
      required: true
  - type: textarea
    id: owns
    attributes:
      label: What this epic owns
      description: The scope — what belongs here and what does not.
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: Expected features
      description: The features you expect under this epic. Each becomes a sub-issue via the Feature template.
      placeholder: "- login page\n- settings page"
    validations:
      required: false

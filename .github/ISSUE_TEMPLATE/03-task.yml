name: "Task"
description: "Level 3 — a single narrow execution item under a feature."
title: "🔨 "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ## Task (level 3)
        A task belongs to exactly one **feature** and is narrowed to a **single, simple execution item**.
        If it needs two outcomes, split it.
  - type: input
    id: feature
    attributes:
      label: Feature (parent)
      description: The feature this task belongs to.
      placeholder: "#34 login page"
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: What to do
      description: One narrow action.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The concrete signal the task is complete.
    validations:
      required: true

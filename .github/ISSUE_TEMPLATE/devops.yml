name: "DevOps (default)"
description: "Default issue — repo plumbing: linting, CI workflows, Dockerfile, deploy, basic usage."
title: "🐳 DevOps"
labels: ["epic", "default"]
body:
  - type: markdown
    attributes:
      value: |
        ## Default issue
        This issue should exist on **every** repo and must **not** be deleted.

        Dockerfile and `.github/` live here: linting, test/release workflows, deploy when applicable, and basic usage.
  - type: textarea
    id: scope
    attributes:
      label: What DevOps owns here
      description: Lint / test / release workflows, Dockerfile, install and usage.
      value: |
        - Lint / test / release workflows (`.github/workflows/`)
        - Dockerfile / container build
        - Basic usage documentation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Repo-specific additions (deploy targets, secrets, pinned toolchains).
    validations:
      required: false

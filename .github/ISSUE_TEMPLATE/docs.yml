name: "Docs (default)"
description: "Default issue — the repo's documentation (`docs/`)."
title: "📚 Docs"
labels: ["epic", "default"]
body:
  - type: markdown
    attributes:
      value: |
        ## Default issue
        This issue should exist on **every** repo and must **not** be deleted.

        Docs = the repo's documentation: guides, references, and the README's supporting material.
  - type: textarea
    id: scope
    attributes:
      label: What Docs owns here
      description: The documentation surface for this repo.
      value: |
        - `docs/` guides and references
        - README supporting material
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Repo-specific documentation needs.
    validations:
      required: false

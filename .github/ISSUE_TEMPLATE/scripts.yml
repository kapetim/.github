name: "Scripts (default)"
description: "Default issue — every code automation in the repo (`scripts/`)."
title: "⚙️ Scripts"
labels: ["epic", "default"]
body:
  - type: markdown
    attributes:
      value: |
        ## Default issue
        This issue should exist on **every** repo and must **not** be deleted.

        Scripts = all code automation in the repo (`scripts/`), including automation that is not part of DevOps linting.
  - type: textarea
    id: scope
    attributes:
      label: What Scripts owns here
      description: The repo's automation entrypoints and helpers.
      value: |
        - `scripts/` automation
        - Helper / tooling scripts
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Repo-specific automation (e.g. profile status automation, data fetchers).
    validations:
      required: false

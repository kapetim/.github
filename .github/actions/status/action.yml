name: Repo status
description: Refresh the repo-status table in the profile README and open a PR.
inputs:
  token:
    description: PAT with contents/PR access to the profile repo.
    required: true
runs:
  using: composite
  steps:
    - name: Update status table
      shell: bash
      env:
        STATUS_TOKEN: ${{ inputs.token }}
        STATUS_OWNER: ${{ github.repository_owner }}
        STATUS_TARGET_REPO: skibiribab/skibiribab
      run: bash "${{ github.action_path }}/../../../scripts/status/update-status.sh"

name: dispatch

# Manual: forward a repository_dispatch event to a target repo. For work that
# cannot be a reusable workflow but must run in the target repo.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repo (owner/name)
        required: true
      event_type:
        description: repository_dispatch event type
        required: true
        default: repo-status

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
        run: gh api "repos/${{ inputs.repo }}/dispatches" -f event_type="${{ inputs.event_type }}"

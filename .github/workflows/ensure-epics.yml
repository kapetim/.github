name: ensure-epics (reusable)

# Manual/reusable: recreate any missing per-folder epic issues. Never auto-runs.
# Callers add a workflow_dispatch workflow that `uses:` this file.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: skibiribab/.github/.github/actions/ensure-epics@main

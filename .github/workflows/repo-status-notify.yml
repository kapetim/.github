name: Repo status

# Dormant: manual only. Fires a repository_dispatch at the honeypot so its status
# listener can refresh the profile table when re-enabled.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify status listener
        run: gh api repos/${{ github.repository_owner }}/.github/dispatches -f event_type=repo-status

name: sync-labels (reusable)

# Manual/reusable: ensure epic/feature/task/default exist. Never auto-runs.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: skibiribab/.github/.github/actions/sync-labels@main

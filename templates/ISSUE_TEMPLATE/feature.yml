name: "Feature"
description: "Level 2 — a feature under an epic; holds tasks."
title: "⭐ "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature (level 2)
        A feature belongs to exactly one **epic** and holds **tasks**.

        Example: `🎨 UI` (epic) → `login page` (feature) → `build form` (task).
  - type: input
    id: epic
    attributes:
      label: Epic (parent)
      description: The epic this feature belongs to.
      placeholder: "#12 🎨 UI"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What the feature is and why it exists.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: What "done" means at the feature level.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Expected tasks
      description: The narrow tasks you expect under this feature. Each becomes a sub-issue via the Task template.
      placeholder: "- build form\n- wire validation"
    validations:
      required: false
